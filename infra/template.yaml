AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CHHAYA MVP — shade- and flood-aware pedestrian routing for Karol Bagh, Delhi.
  Phase 0: GraphBucket + hello-world RouteFunction + HTTP API (CORS) + Location API key
  + minimal CloudWatch dashboard. Route compute, remaining Lambdas, DynamoDB and
  Step Functions land in Phases 2-3 (CLAUDE.md §10).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Tracing: Active
    Timeout: 25

Resources:
  GraphBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RouteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambdas/route/
      Handler: handler.lambda_handler
      # Phase 3 task contract: 1024 MB / 30 s (overrides the Globals defaults below).
      MemorySize: 1024
      # HTTP API caps integration at 30 s (§4).
      Timeout: 30
      Environment:
        Variables:
          GRAPH_BUCKET: !Ref GraphBucket
          # S3 keys mirror pipeline/upload.py's bucket layout (§6 of DEPLOY.md) —
          # the upload tool writes graph/graph.pkl etc., not data/*.
          S3_KEY_GRAPH: graph/graph.pkl
          S3_KEY_SHADE_SUMMER: shade/summer.npy
          S3_KEY_SHADE_MONSOON: shade/monsoon.npy
          S3_KEY_FLOOD: flood/flood.npy
          S3_KEY_COVERAGE: graph/coverage.geojson
          # Phase 3 brief: 1.1 m/s walk speed (overrides §6.6's 1.3).
          WALK_SPEED_MPS: "1.1"
      Policies:
        # Cold-start reads of the routing bundle (graph.pkl + shade/flood arrays
        # + coverage polygon). No geo-routes IAM here by design: the baseline
        # CalculateRoutes call runs in the BROWSER with the referer-restricted
        # LocationApiKey (docs/DECISIONS.md).
        - S3ReadPolicy:
            BucketName: !Ref GraphBucket
      Events:
        RouteApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /route
            Method: any
        RouteStatsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /route/stats
            Method: GET

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      # "*" covers localhost:5173 dev now; tighten to the Amplify domain at first
      # hosting deploy (docs/DEPLOY.md). No cookies are used, so "*" is safe for MVP.
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  LocationApiKey:
    Type: AWS::Location::APIKey
    Properties:
      KeyName: chhaya-location-key
      NoExpiry: true
      Restrictions:
        AllowActions:
          # MapLibre fetches the Maps v2 style descriptor at init — without this action
          # the map renders blank behind a working tile cache (deviation from §7.9,
          # recorded in docs/DECISIONS.md).
          - geo-maps:GetStyleDescriptor
          - geo-maps:GetTile
          - geo-maps:GetStaticMap
          # Places v2 SearchText replaces the Autocomplete+GetPlace pair (§7.10).
          - geo-places:SearchText
          # Baseline pedestrian route is calculated in the BROWSER with this key
          # (decisions.md), so the key — not a Lambda — carries the routes action.
          - geo-routes:CalculateRoutes
        AllowResources:
          - arn:aws:geo-maps:ap-south-1::provider/default
          - arn:aws:geo-places:ap-south-1::provider/default
          - arn:aws:geo-routes:ap-south-1::provider/default
        AllowReferers:
          # Add the Amplify domain at first hosting deploy (docs/DEPLOY.md §4a).
          - http://localhost:5173/*

  PrecomputeHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Phase 5 (§7.9 shade pipeline): Step Functions step. On the MVP the shade
      # compute itself runs OFFLINE (pipeline/shade.py), so this handler is the
      # stub a future real compute swaps in for — it keeps the SAME bucket/key
      # env names as RouteFunction so the swap needs no state-machine change.
      CodeUri: ../lambdas/precompute_handler/
      Handler: handler.lambda_handler
      MemorySize: 512
      Description: Precompute step for the re-precompute state machine (manifest + bundle minimums check).
      Environment:
        Variables:
          GRAPH_BUCKET: !Ref GraphBucket
          S3_KEY_GRAPH: graph/graph.pkl
      Policies:
        # head_object resolves through s3:GetObject; the manifest write needs
        # s3:PutObject — S3CrudPolicy covers both, scoped to GraphBucket.
        - S3CrudPolicy:
            BucketName: !Ref GraphBucket

  PrecomputeStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      # §4 hard constraint: STANDARD workflow (4,000 free transitions/month —
      # never EXPRESS, which bills per request).
      Type: STANDARD
      DefinitionUri: statemachine.asl.json
      # The ${...} placeholders inside statemachine.asl.json are resolved here
      # at deploy (SAM Developer Guide: AWS::Serverless::StateMachine,
      # DefinitionSubstitutions) — verified against live docs before writing.
      DefinitionSubstitutions:
        PrecomputeHandlerArn: !GetAtt PrecomputeHandlerFunction.Arn
      Tracing:
        Enabled: true
      Policies:
        # The state machine invokes exactly one function: PrecomputeHandlerFunction.
        - LambdaInvokePolicy:
            FunctionName: !Ref PrecomputeHandlerFunction

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: chhaya-mvp
      # §7.9 metric set, extended in Phase 5 (task contract):
      #   row 0 — text header + ops notes;
      #   row 1 — RouteFunction Invocations / Duration / Errors (the Phase 0 row, kept);
      #   row 2 — Step Functions ExecutionsStarted/ExecutionsFailed + HttpApi 4xx/5xx.
      # All regions resolve from ${AWS::Region} — region-agnostic by construction.
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
             "properties": {"title": "CHHAYA operational notes",
               "markdown": "# CHHAYA MVP — Karol Bagh\nRoute API health + re-precompute pipeline (Phase 5). Ops note: the $5 budget alert must precede every deploy; open blockers live in docs/BLOCKERS.md (Phase 5 adds none)."}},
            {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
             "properties": {"title": "Invocations", "region": "${AWS::Region}",
               "view": "timeSeries", "stacked": false,
               "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${RouteFunction}"]],
               "period": 300}},
            {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
             "properties": {"title": "Duration (p99 / avg ms)", "region": "${AWS::Region}",
               "view": "timeSeries", "stacked": false,
               "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${RouteFunction}"]],
               "period": 300}},
            {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
             "properties": {"title": "Errors", "region": "${AWS::Region}",
               "view": "timeSeries", "stacked": false,
               "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${RouteFunction}"]],
               "period": 300}},
            {"type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
             "properties": {"title": "Pipeline executions started / failed", "region": "${AWS::Region}",
               "view": "timeSeries", "stacked": false,
               "metrics": [
                 ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${PrecomputeStateMachine}"],
                 ["AWS/States", "ExecutionsFailed", "StateMachineArn", "${PrecomputeStateMachine}"]
               ],
               "period": 300}},
            {"type": "metric", "x": 16, "y": 8, "width": 8, "height": 6,
             "properties": {"title": "HTTP API 4xx / 5xx", "region": "${AWS::Region}",
               "view": "timeSeries", "stacked": false,
               "metrics": [
                 ["AWS/HttpApi", "4xx", "ApiId", "${HttpApi}"],
                 ["AWS/HttpApi", "5xx", "ApiId", "${HttpApi}"]
               ],
               "period": 300}}
          ]
        }

Outputs:
  ApiUrl:
    Description: HTTP API base URL — curl $ApiUrl/route must return {"ok":true} (Phase 0 done-when).
    Value: !GetAtt HttpApi.ApiEndpoint
  BucketName:
    Description: S3 bucket holding graph.pkl / nodes.npz / shade arrays (Phase 2).
    Value: !Ref GraphBucket
  LocationApiKeyArn:
    Description: Location API key ARN — fetch the value with `aws location describe-key` (docs/DEPLOY.md §4b).
    Value: !GetAtt LocationApiKey.Arn
